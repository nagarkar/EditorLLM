/**
 * Fetches all session log entries from the server and copies them to clipboard.
 * Uses execCommand fallback for the GAS sidebar iframe context.
 */
function copyAllSessionLogs() {
    setStatus('Fetching session logs…', 'loading');
    runServer('getAllSessionLogs').then(function (entries) {
        if (!entries || !entries.length) {
            setStatus('No session logs found.', 'loading');
            return;
        }
        var lines = entries.map(function (e) {
            return (e.ts || '') + '  ' + (e.level || 'INFO').padEnd(5) + '  ' + (e.msg || '');
        });
        var text = lines.join('\n');
        function fallback() {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                setStatus('Copied ' + lines.length + ' log lines to clipboard.', 'info');
            }
            catch (copyErr) {
                console.error('[copyLogsToClipboard] execCommand fallback failed', copyErr);
                setStatus('Copy failed — use the log view (≡ Logs) to copy instead.', 'error');
            }
            document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
                setStatus('Copied ' + lines.length + ' log lines to clipboard.', 'info');
            }, fallback);
        }
        else {
            fallback();
        }
    }).catch(function (e) {
        setStatus('Error fetching logs: ' + (e.message || e), 'error');
    });
}
/** Max lines kept in Recent activity (sidebar). */
var RECENT_RUNS_MAX = 25;
var _toastHideTimer = null;
function truncateOneLine(text, maxLen) {
    if (!text)
        return '';
    var parts = String(text).split(/\r?\n/);
    var one = '';
    for (var i = 0; i < parts.length; i++) {
        var s = parts[i].trim();
        if (s) {
            one = s;
            break;
        }
    }
    if (!one)
        one = String(text).trim();
    if (one.length <= maxLen)
        return one;
    return one.slice(0, maxLen - 1) + '…';
}
function escapeHtml(text) {
    return String(text == null ? '' : text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}
function timeHHMMSS() {
    var d = new Date();
    function z(n) { return n < 10 ? '0' + n : '' + n; }
    return z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds());
}
/**
 * Prepends a completed or failed run to Recent activity.
 * @param {string} sourceLabel Short tag: Status, Merge, Refresh, Sweep.
 */
function appendRecentRun(sourceLabel, msg, ok) {
    var list = document.getElementById('recent-runs-list');
    if (!list)
        return;
    var line = String(msg || '').trim();
    if (!line)
        return;
    var li = document.createElement('li');
    li.className = 'recent-run-line ' + (ok ? 'recent-run-ok' : 'recent-run-fail');
    if (line.length > 100)
        li.title = line;
    var t = document.createElement('span');
    t.className = 'recent-run-time';
    t.textContent = timeHHMMSS();
    var mark = document.createElement('span');
    mark.className = 'recent-run-mark';
    mark.textContent = ok ? '✓ ' : '✗ ';
    var src = document.createElement('span');
    src.className = 'recent-run-src';
    src.textContent = '[' + (sourceLabel || 'Task') + '] ';
    var body = document.createElement('span');
    body.textContent = truncateOneLine(line, 220);
    li.appendChild(t);
    li.appendChild(mark);
    li.appendChild(src);
    li.appendChild(body);
    list.insertBefore(li, list.firstChild);
    while (list.children.length > RECENT_RUNS_MAX) {
        list.removeChild(list.lastChild);
    }
}
/** Brief toast for success / error so users see feedback without opening logs. */
function showOutcomeToast(msg, type) {
    var host = document.getElementById('toast-host');
    if (!host)
        return;
    var line = truncateOneLine(msg, 160);
    if (!line)
        return;
    if (_toastHideTimer) {
        clearTimeout(_toastHideTimer);
        _toastHideTimer = null;
    }
    host.innerHTML = '';
    var t = document.createElement('div');
    t.className = 'toast ' + (type === 'error' ? 'toast-error' : 'toast-success');
    t.textContent = line;
    host.appendChild(t);
    _toastHideTimer = setTimeout(function () {
        t.classList.add('toast-out');
        setTimeout(function () {
            if (t.parentNode === host)
                host.removeChild(t);
        }, 280);
        _toastHideTimer = null;
    }, 4800);
}
function notifyOutcomeIfTerminal(sourceLabel, msg, type) {
    if (type !== 'info' && type !== 'error')
        return;
    var line = String(msg || '').trim();
    if (!line)
        return;
    appendRecentRun(sourceLabel, line, type !== 'error');
    showOutcomeToast(line, type);
}

// ── Busy overlay spinner ────────────────────────────────────────────────────
// Reference-counted so overlapping calls (rapid clicks, background polls)
// never hide the spinner while another call is still in flight.
var _spinnerCount = 0;
function showSpinner() {
    _spinnerCount++;
    if (_spinnerCount === 1) {
        var el = document.getElementById('spinner-overlay');
        if (el)
            el.style.display = 'flex';
    }
}
function hideSpinner() {
    _spinnerCount = Math.max(0, _spinnerCount - 1);
    if (_spinnerCount === 0) {
        var el = document.getElementById('spinner-overlay');
        if (el)
            el.style.display = 'none';
    }
}
/**
 * Wraps google.script.run in a Promise.
 * Always shows the busy spinner before the call and hides it in .finally()
 * so the spinner is guaranteed to clear on both success AND failure.
 */
function runServer(fnName, ...args) {
    showSpinner();
    return new Promise(function (resolve, reject) {
        var call = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject);
        call[fnName].apply(call, args);
    }).finally(function () {
        hideSpinner();
    });
}

/**

/** Row prefix matches Sidebar ids: `{prefix}-row`, `{prefix}-badge`, `{prefix}-rationale`. */
function renderOneInstructionScoreRow(rowPrefix, data) {
    var row = document.getElementById(rowPrefix + '-row');
    var badge = document.getElementById(rowPrefix + '-badge');
    var rationale = document.getElementById(rowPrefix + '-rationale');
    if (!row || !badge)
        return;
    if (!data || data.score === null) {
        row.style.display = 'none';
        return;
    }
    var score = data.score;
    var color = score >= 4 ? '#81C784' : score >= 3 ? '#FFB74D' : '#EF9A9A';
    var bg = score >= 4 ? '#1B3B2A' : score >= 3 ? '#3B2C15' : '#3B1B1B';
    badge.textContent = score + '/5';
    badge.style.color = color;
    badge.style.background = bg;
    if (rationale)
        rationale.textContent = data.rationale || '';
    row.style.display = 'block';
}
function renderInstructionQualityRows(scores) {

    renderOneInstructionScoreRow('tts-instr-score', scores.tts);
}

// Created lazily on first initMainTab() so the DOM is ready.
var _manuscriptMultiselect = null;
var _managedMultiselect = null;
/**
 * Initialise both multiselect widgets and load the document tab list
 * into them as the available option set.
 */
function initMultiselects() {
    var manuscriptContainer = document.getElementById('manuscript-multiselect');
    var managedContainer = document.getElementById('managed-multiselect');
    if (!manuscriptContainer || !managedContainer)
        return;
    if (!_manuscriptMultiselect) {
        _manuscriptMultiselect = MultiSelectTabs.create({
            container: manuscriptContainer,
            placeholder: 'Add tab to manuscript…',
        });
    }
    if (!_managedMultiselect) {
        _managedMultiselect = MultiSelectTabs.create({
            container: managedContainer,
            placeholder: 'Add managed tab…',
        });
    }
    // Populate option lists from live document tab names.
    google.script.run
        .withSuccessHandler(function (tabNames) {
        if (_manuscriptMultiselect)
            _manuscriptMultiselect.setOptions(tabNames);
        if (_managedMultiselect)
            _managedMultiselect.setOptions(tabNames);
    })
        .getTabNames();
}

        if (_manuscriptMultiselect)
            _manuscriptMultiselect.setValues(names);
        setMergeProgress(names.length ? 'Loaded ' + names.length + ' saved tab name(s).' : 'No saved names found.');
    })
        .withFailureHandler(function (e) { setMergeStatus('Error loading: ' + e.message, 'error'); })
        .getManuscriptTabNames();

async function createOrOverwriteManuscript() {
    _notifyJobStart_();
    var names = _manuscriptMultiselect ? _manuscriptMultiselect.getValues() : [];
    if (!names.length) {
        setMergeStatus('Enter at least one tab name.', 'error');
        return;
    }
    // Auto-save the names before merging (silently to avoid masking progress).
    saveManuscriptTabNames(true);
    var btn = document.getElementById('manuscriptBtn');
    btn.disabled = true;
    setMergeStatus('', '');
    setMergeProgress('Creating manuscript from ' + names.length + ' tab(s)… Please wait.');
    try {
        var res = await runServer('createOrOverwriteManuscript', names);
        if (res && res.ok) {
            setMergeProgress('');
            setMergeStatus('Manuscript created from ' + res.successes + ' tab(s).', 'info');
        }
        else {
            setMergeProgress('');
            var errMsg = 'Completed with errors.\nOK: ' + (res.successes || 0) +
                '  Failed: ' + (res.errors ? res.errors.length : 1) +
                '\n\n' + (res.errors ? res.errors.join('\n') : 'Unknown error');
            setMergeStatus(errMsg, 'error');
        }
    }
    catch (err) {
        console.error('[createOrOverwriteManuscript]', err);
        setMergeProgress('');
        setMergeStatus('Error: ' + err.message, 'error');
    }
    finally {
        btn.disabled = false;
    }
}

function initMainTab() {
    if (_mainInitialized)
        return;
    _mainInitialized = true;
    loadModelConfig();
    loadHighlightColor();
    loadDebugMode();
    try {
        initMultiselects(); // create multiselect widgets + populate tab options

    catch (e) {
        // Guard: if MultiSelectTabs is unavailable (e.g. script load order issue),
        // don't let the exception abort quality-score loading below.
        console.error('[initMainTab] initMultiselects failed:', e);
    }
    loadSavedManuscriptTabNames(); // pre-select saved manuscript tab names
    loadSavedManagedTabNames(); // pre-select saved managed tab names
    loadStyleProfileScore();
    loadInstructionQualityScores();
}

            datalist.appendChild(opt);
        });

    }
    ['gemini-model-fast', 'gemini-model-thinking', 'gemini-model-deepseek'].forEach(function (id) {

/** Current agentKey selected in the sweep overlay ('eartune'|'audit'|'tether'). */
var _sweepAgentKey = '';
function setSweepStatus(msg, type) {
    setElementStatus('sweep-status', 'Sweep', msg, type);
}
/**
 * Opens the sweep overlay for the given agent.
 * Fetches all document tab names, pre-checks those in the saved merge list,
 * then renders a checkbox list for the user to confirm.
 */
function openSweepOverlay(agentKey, agentLabel) {
    _sweepAgentKey = agentKey;
    document.getElementById('sweep-agent-badge').textContent = agentLabel + ' Annotation Sweep';
    document.getElementById('sweep-tab-list').innerHTML = '<span style="color:#A0A0A0;font-size:11px;">Loading tabs…</span>';
    setSweepStatus('', '');
    document.getElementById('sweep-confirm-btn').disabled = false;
    document.getElementById('sweep-overlay').style.display = 'flex';
    // Load all tab names AND saved merge names in parallel, then render.
    var allTabs = null;
    var mergeNames = null;
    function maybeRender() {
        if (allTabs === null || mergeNames === null)
            return;
        var mergeSet = new Set(mergeNames);
        var listEl = document.getElementById('sweep-tab-list');
        if (!allTabs.length) {
            listEl.innerHTML = '<span style="color:#A0A0A0;font-size:11px;">No tabs found.</span>';
            return;
        }
        listEl.innerHTML = '';
        allTabs.forEach(function (name) {
            var label = document.createElement('label');
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = name;
            cb.checked = mergeSet.has(name);
            cb.id = 'sweep-cb-' + name.replace(/\s+/g, '-');
            label.appendChild(cb);
            label.appendChild(document.createTextNode(name));
            listEl.appendChild(label);
        });
    }
    // Only show tabs that are eligible for agent operations (not in never-processed
    // subtrees; within the user allowlist when one is configured).
    google.script.run
        .withSuccessHandler(function (tabs) { allTabs = tabs || []; maybeRender(); })
        .withFailureHandler(function (e) {
        document.getElementById('sweep-tab-list').innerHTML =
            '<span style="color:#EF9A9A;font-size:11px;">Error loading tabs: ' + e.message + '</span>';
    })
        .getManageableTabNames();
    google.script.run
        .withSuccessHandler(function (names) { mergeNames = names || []; maybeRender(); })
        .withFailureHandler(function () { mergeNames = []; maybeRender(); })
        .getManuscriptTabNames();
}
function closeSweepOverlay() {
    document.getElementById('sweep-overlay').style.display = 'none';
}
/** Collects checked tabs and kicks off the annotation sweep via google.script.run. */
async function confirmSweep() {
    _notifyJobStart_();
    var checkboxes = document.querySelectorAll('#sweep-tab-list input[type=checkbox]:checked');
    var selected = [];
    checkboxes.forEach(function (cb) { selected.push(cb.value); });
    if (!selected.length) {
        setSweepStatus('Select at least one tab.', 'error');
        return;
    }
    var btn = document.getElementById('sweep-confirm-btn');
    btn.disabled = true;
    setSweepStatus('Sweeping ' + selected.length + ' tab(s)… See log view for progress.', 'loading');
    try {
        var result = await runServer('annotateSelectedTabs', _sweepAgentKey, selected);
        if (result && result.ok) {
            setSweepStatus('Sweep complete — ' + selected.length + ' tab(s) annotated.', 'info');
        }
        else {
            var errs = (result && result.errors) ? result.errors.join('\n') : 'Unknown error';
            setSweepStatus('Sweep finished with errors:\n' + errs, 'error');
        }
    }
    catch (e) {
        console.error('[runSweep]', e);
        setSweepStatus('Error: ' + e.message, 'error');
    }
    finally {
        btn.disabled = false;
    }
}

// Switches between main panel, tts panel, and log panel (sidebar or dialog-mode).

function switchTab(tabId) {

    var publisherPanel = document.getElementById('publisher-panel');
    var agentsPanel = document.getElementById('agents-panel');
    mainPanel.style.display = 'none';
    logSection.style.display = 'none';
    ttsPanel.style.display = 'none';
    publisherPanel.style.display = 'none';
    if (agentsPanel)
        agentsPanel.style.display = 'none';
    document.body.classList.remove('log-view');
    if (tabId === 'logs') {
        logSection.style.display = ''; // remove inline override so CSS display:flex applies
        document.body.classList.add('log-view');
        initLogPanel();
    }
    else if (tabId === 'tts') {
        ttsPanel.style.display = 'block';
        initTtsTab();
    }
    else if (tabId === 'publisher') {
        publisherPanel.style.display = 'block';
        initPublisherTab();
    }
    else if (tabId === 'agents') {
        if (agentsPanel)
            agentsPanel.style.display = 'block';
        initAgentsPanel();
    }
    else {
        mainPanel.style.display = 'block';
        initMainTab();
    }
    // Highlight the active tab button; all buttons remain visible.
    ['main', 'tts', 'publisher', 'agents', 'logs'].forEach(function (id) {
        var active = (id === tabId);
        ['sb-tab-', 'dw-tab-'].forEach(function (prefix) {
            var btn = document.getElementById(prefix + id);
            if (btn)
                btn.classList.toggle('tab-active', active);

// ── Log Rendering ──────────────────────────────────────
function appendEntries(entries) {
    if (!entries || !entries.length)
        return;
    var p = logPanel();
    var emptyEl = logEmpty();
    entries.forEach(function (entry) {
        if (emptyEl)
            emptyEl.style.display = 'none';
        var div = document.createElement('div');
        div.className = 'log-entry ' + (entry.level || 'INFO');
        var tsSpan = document.createElement('span');
        tsSpan.className = 'log-ts';
        tsSpan.textContent = entry.ts || '';
        var lvlSpan = document.createElement('span');
        lvlSpan.className = 'log-level';
        lvlSpan.textContent = (entry.level || 'INFO').toUpperCase();
        div.appendChild(tsSpan);
        div.appendChild(lvlSpan);
        div.appendChild(document.createTextNode(entry.msg || ''));
        p.appendChild(div);
        entryCount++;
        if (entry.seq > lastSeq)
            lastSeq = entry.seq;
    });
    logCountEl().textContent = entryCount + (entryCount === 1 ? ' entry' : ' entries');
    if (autoScroll)
        p.scrollTop = p.scrollHeight;
}
function clearLogPanel() {
    var p = logPanel();
    while (p.lastChild && p.lastChild !== logEmpty()) {
        p.removeChild(p.lastChild);
    }
    var emptyEl = logEmpty();
    if (emptyEl)
        emptyEl.style.display = '';
    entryCount = 0;
    logCountEl().textContent = '0 entries';
}
function toggleAutoScroll() {

// ── Job Dropdown ───────────────────────────────────────
function statusIcon(jobId) {
    var meta = jobs.find(function (j) { return j.id === jobId; });
    if (!meta)
        return '⟳';
    if (meta._done && meta._error)
        return '✕';
    if (meta._done)
        return '✓';
    return '⟳';
}
function renderJobDropdown() {
    var sel = jobSelectEl();
    sel.innerHTML = '';
    if (!jobs.length) {
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '— No jobs yet —';
        sel.appendChild(opt);
        return;
    }
    // Show all jobs (running and completed) so recently-finished jobs remain visible.
    jobs.forEach(function (job) {
        var opt = document.createElement('option');
        opt.value = job.id;
        opt.textContent = statusIcon(job.id) + ' ' + job.label + '  (' + job.startedAt + ')';
        if (job.id === activeJobId)
            opt.selected = true;
        sel.appendChild(opt);
    });
}
function onJobSelectChange() {

    var jobId = sel.value;
    if (jobId && jobId !== activeJobId)
        selectJob(jobId);

// ── Job Selection ──────────────────────────────────────
function selectJob(jobId) {
    if (activeJobId === jobId)
        return;
    activeJobId = jobId;
    lastSeq = 0;
    entryCount = 0;
    clearLogPanel();
    renderJobDropdown();
    stopLogPolling();
    setLogFooter('Loading logs…', '');
    logSpinner().classList.remove('hidden');
    google.script.run
        .withSuccessHandler(function (entries) {
        appendEntries(entries);
        google.script.run
            .withSuccessHandler(function (status) {
            updateJobMeta(jobId, status);
            renderJobDropdown();
            if (status && status.done) {
                showJobDone(status);
            }
            else {
                setLogFooter('Live polling…', '');
                startLogPolling();
            }
        })
            .withFailureHandler(function () {
            setLogFooter('Polling…', '');
            startLogPolling();
        })
            .getJobStatus(jobId);
    })
        .withFailureHandler(function (e) {
        setLogFooter('Error loading logs: ' + (e.message || e), 'error');
    })
        .getLogsSince(jobId, 0);
}
function showJobDone(status) {
    logSpinner().classList.add('hidden');
    if (status.error) {
        setLogFooter('Error: ' + status.error, 'error');
    }
    else {
        setLogFooter('Completed successfully.', 'success');
    }
}
function updateJobMeta(jobId, status) {
    if (!status)
        return;
    var job = jobs.find(function (j) { return j.id === jobId; });
    if (job) {
        job._done = status.done;
        job._error = status.error;
    }
}
// ── Close Completed Jobs ───────────────────────────────
function closeCompletedJobs() {
    setLogFooter('Removing completed jobs…', '');
    google.script.run
        .withSuccessHandler(function (remainingJobs) {
        var oldMap = {};
        jobs.forEach(function (j) { oldMap[j.id] = j; });
        remainingJobs.forEach(function (j) {
            if (oldMap[j.id]) {
                j._done = oldMap[j.id]._done;
                j._error = oldMap[j.id]._error;
            }
        });
        jobs = remainingJobs;
        var activeStillExists = jobs.some(function (j) { return j.id === activeJobId; });
        if (!activeStillExists) {
            activeJobId = null;
            clearLogPanel();
            stopLogPolling();
            var runningJobs = jobs.filter(function (j) { return !j._done; });
            if (runningJobs.length) {
                selectJob(runningJobs[0].id);
            }
            else {
                setLogFooter('No running jobs.', '');
            }
        }
        renderJobDropdown();
        setLogFooter('Completed jobs removed.', 'success');
    })
        .withFailureHandler(function (e) {
        setLogFooter('Error: ' + (e.message || e), 'error');
    })
        .removeCompletedJobs();
}
// ── Log Polling ────────────────────────────────────────
function stopLogPolling() {
    if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
    }
    logSpinner().classList.add('hidden');
}
function startLogPolling() {
    stopLogPolling();
    logSpinner().classList.remove('hidden');
    pollTimer = setInterval(pollLogs, LOG_POLL_MS);
}
function pollLogs() {
    if (!activeJobId)
        return;
    var jid = activeJobId;
    var capturedSeq = lastSeq;
    google.script.run
        .withSuccessHandler(function (entries) {
        if (jid !== activeJobId)
            return;
        if (entries && entries.length)
            appendEntries(entries);
    })
        .withFailureHandler(function () { })
        .getLogsSince(jid, capturedSeq);
}
function pollJobDashboard() {
    google.script.run
        .withSuccessHandler(function (serverJobs) {
        if (!serverJobs || !serverJobs.length) {
            jobs = [];
            renderJobDropdown();
            setLogFooter('No jobs yet. Enable Debug Mode and run an agent to see logs.', '');
            return;
        }
        serverJobs.forEach(function (j) {
            j._done = j.done;
            j._error = j.error;
        });
        var previousNewest = jobs.length ? jobs[0].id : null;
        jobs = serverJobs;
        renderJobDropdown();
        var newestId = serverJobs[0] ? serverJobs[0].id : null;
        if (newestId && (!activeJobId || newestId !== previousNewest)) {
            selectJob(newestId);
        }
        var current = jobs.find(function (j) { return j.id === activeJobId; });
        if (current) {
            if (current._done) {
                if (pollTimer) {
                    stopLogPolling();
                    showJobDone(current);
                }
            }
            else {
                if (!pollTimer)
                    startLogPolling();
            }
        }
    })
        .withFailureHandler(function () { })
        .getJobDashboard();
}
function refreshJobs() {
    setLogFooter('Refreshing…', '');
    pollJobDashboard();
}

function formatLogsAsText(entries) {
    return entries.map(function (e) {
        return (e.ts || '') + '  ' + (e.level || 'INFO').padEnd(5) + '  ' + (e.msg || '');
    }).join('\n');
}
function copyToClipboard(text, label) {
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            setLogFooter((label || 'Logs') + ' copied (' + text.split('\n').length + ' lines).', 'success');
        }
        catch (copyErr) {
            console.error('[copyLogs] execCommand fallback failed', copyErr);
            setLogFooter('Copy failed — select text manually.', 'error');
        }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
            setLogFooter((label || 'Logs') + ' copied (' + text.split('\n').length + ' lines).', 'success');
        }, fallback);
    }
    else {
        fallback();
    }
}
function copyJobLogs() {
    var entries = logPanel().querySelectorAll('.log-entry');
    if (!entries.length) {
        setLogFooter('No log entries to copy.', '');
        return;
    }
    var lines = [];
    entries.forEach(function (div) {
        var ts = div.querySelector('.log-ts') ? div.querySelector('.log-ts').textContent : '';
        var lvl = div.querySelector('.log-level') ? div.querySelector('.log-level').textContent : '';
        var msg = '';
        div.childNodes.forEach(function (node) {
            if (node.nodeType === 3)
                msg += node.textContent;
        });
        lines.push(ts + '  ' + lvl.padEnd(5) + '  ' + msg.trim());
    });
    copyToClipboard(lines.join('\n'), 'Job logs');
}
function copyAllLogs() {
    setLogFooter('Fetching all session logs…', '');
    google.script.run
        .withSuccessHandler(function (entries) {
        if (!entries || !entries.length) {
            setLogFooter('No session logs found.', '');
            return;
        }
        copyToClipboard(formatLogsAsText(entries), 'All session logs');
    })
        .withFailureHandler(function (e) {
        setLogFooter('Error fetching logs: ' + (e.message || e), 'error');
    })
        .getAllSessionLogs();
}

            modelSel.appendChild(opt);
        });
    }
    else if (document.getElementById('tts-modelSelect').value) {

    }
    populateVoiceSelect_(document.getElementById('edit-voice-select'), _ttsSavedPrefs.voiceId || document.getElementById('tts-voiceSelect').value || '');
    overlay.style.display = 'flex';
}
function closeDirectiveEdit() {

function deleteDirectiveFromEdit() {

}
function saveDirectiveEdit() {
    var modelId = document.getElementById('edit-tts-model').value;
    var voiceId = document.getElementById('edit-voice-select').value;
    var stability = parseFloat(document.getElementById('edit-stability').value);
    var similarityBoost = parseFloat(document.getElementById('edit-similarity-boost').value);

    };
    if (_isAddingDirective) {
        setTtsStatus('Adding directive from current cursor…', 'loading');

            .withSuccessHandler(function () {
            setTtsStatus('Directive added.', 'info');
            closeDirectiveEdit();
            loadTtsDirectives(true);
        })
            .withFailureHandler(function (e) {
            setTtsStatus('Error adding directive: ' + e.message, 'error');
        })
            .addTtsDirectiveFromSelection(tabName, newPayload);
        return;
    }
    setTtsStatus('Updating directive…', 'loading');

        .withSuccessHandler(function () {
        setTtsStatus('Directive updated.', 'info');
        closeDirectiveEdit();
        loadTtsDirectives(true);
    })
        .withFailureHandler(function (e) {
        setTtsStatus('Error updating directive: ' + e.message, 'error');
    })
        .updateTtsDirective(tabName, bookmarkId, oldName, newPayload);
}
function deleteDirective(d) {

        return;

        .withSuccessHandler(function () {
        setTtsStatus('Directive deleted.', 'info');
        loadTtsDirectives(true);
    })
        .withFailureHandler(function (e) {
        var msg = (e && e.message) ? e.message : (e || 'Unknown error');
        setTtsStatus('Error deleting directive: ' + msg, 'error');
    })
        .deleteTtsDirective(tabName, d.bookmarkId, d.name);
}

function saveAllTtsSettings() {
    var key = document.getElementById('tts-apiKey').value.trim();
    var modelId = document.getElementById('tts-modelSelect')?.value;
    var voiceId = document.getElementById('tts-voiceSelect')?.value;
    if (modelId)
        google.script.run.elevenLabsSaveModelPreference(modelId);
    if (voiceId)
        google.script.run.elevenLabsSaveVoicePreference(voiceId);
    if (!key) {
        setTtsStatus('Settings saved.', 'info');
        setTimeout(function () { setTtsStatus('', ''); }, 2000);
        return;
    }
    var warning = 'You have set the API key. Anyone with access to this document will be able to use related features, but not see your key.\n\nDo you want to continue?';
    if (!confirm(warning))
        return;
    setTtsStatus('Saving…', 'loading');
    google.script.run
        .withSuccessHandler(function () {
        document.getElementById('tts-apiKey').value = '';
        document.getElementById('tts-apiKey').placeholder = '**** (set)';
        setTtsStatus('Settings saved.', 'info');
        setTimeout(function () { setTtsStatus('', ''); }, 2000);
        loadTtsPreferences_(function () {
            loadTtsVoiceMappings();
            loadTtsVoices();
            loadTtsModels();
        });
    })
        .withFailureHandler(function (e) {
        setTtsStatus('Error: ' + e.message, 'error');
    })
        .elevenLabsSaveApiKey(key);
}
function loadTtsPreferences_(callback) {
    google.script.run
        .withSuccessHandler(function (prefs) {
        if (prefs)
            _ttsSavedPrefs = prefs;
        if (callback)
            callback();
    })
        .elevenLabsGetPreferences();

function loadTtsVoiceMappings() {

function saveTtsModelPreference() {

function loadTtsVoices() {
    var useCase = '';
    setSelectLoading_('tts-voiceSelect', 'Loading voices…');
    google.script.run
        .withSuccessHandler(function (list) {
        _ttsVoices = list || [];

            _ttsVoiceMappings = {};
            _ttsVoices.forEach(function (v) {
                _ttsVoiceMappings[v.voice_id] = v.name;
            });
        }
        refreshVoiceDependentUi_();
    })
        .withFailureHandler(function (e) {
        if (_ttsVoiceMappings && Object.keys(_ttsVoiceMappings).length) {
            _ttsVoices = null;
            refreshVoiceDependentUi_();
            setTtsStatus('Voice list unavailable; using cached voice names.', 'info');
            return;
        }
        var msg = (e && e.message) ? e.message : 'Could not load voices';
        var selectMsg = isVoicePermissionError_(e)
            ? 'Please give the Eleven Labs API sufficient permissions'
            : 'Could not load voices';

        setTtsStatus(msg, 'error');
    })
        .elevenLabsListVoices(useCase);

function loadTtsModels() {
    setSelectLoading_('tts-modelSelect', 'Loading models…');
    google.script.run
        .withSuccessHandler(function (list) {
        _ttsModels = list;
        var sel = document.getElementById('tts-modelSelect');
        sel.disabled = false;
        sel.innerHTML = '';

            var empty = document.createElement('option');
            empty.value = '';
            empty.textContent = '(no models)';
            sel.appendChild(empty);
        }
        (list || []).forEach(function (m) {
            var opt = document.createElement('option');
            opt.value = m.model_id;
            opt.textContent = m.name;
            if (m.model_id === (_ttsSavedPrefs.modelId || 'eleven_multilingual_v2'))
                opt.selected = true;
            sel.appendChild(opt);
        });
    })
        .withFailureHandler(function () {
        setSelectLoading_('tts-modelSelect', 'Could not load models');
    })
        .elevenLabsListModels();
}

// ── 10-dialog.js ──────────────────────────────
// ── Dialog wrapper log routing ──────────────────────────
// When a job-starting action is triggered from the dialog wrapper, we switch
// the dialog to its own Logs tab so the user can see progress without the
// server opening/switching the sidebar.  `_notifyJobStart_()` is called at
// the start of every async job function; it is a no-op in sidebar mode.
function _notifyJobStart_() {
    if (document.body.classList.contains('dialog-mode')) {
        switchTab('logs');
        // Trigger an immediate dashboard refresh so the new job appears without
        // waiting for the 10-second poll interval.
        pollJobDashboard();
    }
}
// Tell the server the dialog is open so runTrackedJob_ skips showSidebar().
// Done once at startup — the 10-minute TTL in UserCache covers a typical session.
(function () {
    if (document.body.classList.contains('dialog-mode')) {
        google.script.run.setDialogOpen(true);
    }
})();

// ── 11-custom-agents.js ──────────────────────────────
// ── Custom Agents panel ───────────────────────────────────────────────────────
// Manages the #agents-panel: list, create, edit, delete, share, and
// W2/W3 dispatch for user-defined agents.
// Also owns the manifest overlay and the "Generate Manifest" flow.
// ── State ─────────────────────────────────────────────────────────────────────
var agentsList_ = [];
var currentUserEmail_ = '';
var currentManifestJson_ = '';
// ── Initialisation (called by switchTab) ─────────────────────────────────────
function initAgentsPanel() {
    refreshAgentsList();
    initAutoCleanup();
    initTeamAnalysisPanel();
}
// ── List ──────────────────────────────────────────────────────────────────────
function refreshAgentsList() {
    const statusEl = document.getElementById('agents-status');
    if (statusEl)
        statusEl.textContent = 'Loading…';
    runServer('listCustomAgents').then(function (resp) {
        agentsList_ = resp.agents || [];
        currentUserEmail_ = resp.currentUserEmail || '';
        renderAgentsList_();
        if (statusEl)
            statusEl.textContent = '';
    }).catch(function (err) {
        if (statusEl)
            statusEl.textContent = 'Error loading agents: ' + err;
    });
}
function renderAgentsList_() {
    const listEl = document.getElementById('agents-list');
    if (!listEl)
        return;
    if (!agentsList_.length) {
        listEl.innerHTML =
            '<div style="font-size:12px; color:var(--text-secondary); padding:8px 0;">No custom agents yet. Click + New Agent to create one.</div>';
        return;
    }
    listEl.innerHTML = agentsList_.map(function (a) {
        const workflows = [];
        if (a.workflows.w2)
            workflows.push('W2');
        if (a.workflows.w3)
            workflows.push('W3');
        if (a.workflows.w6)
            workflows.push('W6');
        const workflowBadge = workflows.length
            ? '<span style="font-size:10px; background:#1A3461; color:#8AB4F8; border-radius:3px; padding:1px 5px;">' + workflows.join('+') + '</span>'
            : '';
        const shareBadge = a.storedIn === 'document'
            ? '<span style="font-size:10px; background:#1A3A1A; color:#81c995; border-radius:3px; padding:1px 5px;" title="Shared with document (owner: ' + (a.ownerEmail || 'unknown') + ')">doc</span>'
            : a.storedIn === 'script'
                ? '<span style="font-size:10px; background:#2A1A3A; color:#C58AF8; border-radius:3px; padding:1px 5px;" title="Shared with everyone (owner: ' + (a.ownerEmail || 'unknown') + ')">global</span>'
                : '';
        // Non-owners of shared agents can run but not modify.
        const isOwner = a.storedIn === 'user' || !a.ownerEmail || a.ownerEmail === currentUserEmail_;
        const disabledAttr = isOwner ? '' : ' disabled title="Only the owner can edit this shared agent"';
        const disabledStyle = isOwner ? '' : ' style="opacity:0.4; cursor:not-allowed;"';
        return '<div class="agent-card" style="padding:8px 10px;">' +
            '<div style="display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;">' +
            '<div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">' +
            '<span style="font-size:13px; font-weight:600;">' + escapeHtml_(a.displayName) + '</span>' +
            '<span style="font-size:11px; color:var(--text-secondary); font-family:monospace;">' + escapeHtml_(a.tag) + '</span>' +
            workflowBadge +
            shareBadge +
            '</div>' +
            '<div style="display:flex; gap:4px; flex-shrink:0;">' +
            (a.workflows.w2
                ? '<button class="btn-green btn-sm" onclick="runAgentAnnotate_(\'' + a.id + '\')" title="Run W2 on active tab">Annotate</button>'
                : '') +
            (a.workflows.w6
                ? '<button class="btn-green btn-sm" onclick="openW6Overlay(\'' + a.id + '\')" title="Run W6 — Run with Context">W6</button>'
                : '') +
            '<button class="btn-ghost btn-sm"' + disabledAttr + disabledStyle + ' onclick="' + (isOwner ? 'openAgentEditor(\'' + a.id + '\')' : '') + '">Edit</button>' +
            (a.storedIn === 'user'
                ? '<button class="btn-ghost btn-sm" onclick="shareAgent_(\'' + a.id + '\')" title="Share with document collaborators">Share</button>'
                : '<button class="btn-ghost btn-sm"' + disabledAttr + disabledStyle + ' onclick="' + (isOwner ? 'unshareAgent_(\'' + a.id + '\')' : '') + '" title="Move back to personal storage">Unshare</button>') +
            '<button class="btn-ghost btn-sm"' + disabledAttr + (isOwner ? ' style="color:var(--warn-fg);"' : disabledStyle) + ' onclick="' + (isOwner ? 'deleteAgent_(\'' + a.id + '\', \'' + escapeHtml_(a.displayName).replace(/'/g, "\\'") + '\')' : '') + '">Delete</button>' +
            '</div>' +
            '</div>' +
            '<div style="margin-top:4px; font-size:11px; color:var(--text-secondary);">' +
            (a.instructionTabName ? 'Instructions: <em>' + escapeHtml_(a.instructionTabName) + '</em>' : '<em>System prompt only</em>') +
            (a.contextTabName ? ' &nbsp;|&nbsp; Context: <em>' + escapeHtml_(a.contextTabName) + '</em>' : '') +
            '</div>' +
            '</div>';
    }).join('');
}
function escapeHtml_(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// ── Agent editor ──────────────────────────────────────────────────────────────
function openAgentEditor(agentId) {
    const overlay = document.getElementById('agent-editor-overlay');
    const titleEl = document.getElementById('agent-editor-title');
    const idInput = document.getElementById('agent-editor-id');
    const statusEl = document.getElementById('agent-editor-status');
    if (!overlay)
        return;
    if (statusEl)
        statusEl.textContent = '';
    if (agentId) {
        const existing = agentsList_.find(function (a) { return a.id === agentId; });
        if (!existing)
            return;
        if (titleEl)
            titleEl.textContent = 'Edit Agent';
        idInput.value = existing.id;
        document.getElementById('agent-name').value = existing.displayName;
        document.getElementById('agent-tag').value = existing.tag;
        document.getElementById('agent-instruction-tab').value = existing.instructionTabName || '';
        document.getElementById('agent-context-tab').value = existing.contextTabName || '';
        document.getElementById('agent-system-prompt').value = existing.systemPrompt;
        document.getElementById('agent-w2').checked = existing.workflows.w2;
        document.getElementById('agent-w3').checked = existing.workflows.w3;
        document.getElementById('agent-w6').checked = existing.workflows.w6 ?? false;
        const storageId = existing.storedIn === 'document' ? 'agent-storage-doc'
            : existing.storedIn === 'script' ? 'agent-storage-script'
                : 'agent-storage-user';
        const storageEl = document.getElementById(storageId);
        if (storageEl)
            storageEl.checked = true;
    }
    else {
        if (titleEl)
            titleEl.textContent = 'New Agent';
        idInput.value = '';
        document.getElementById('agent-name').value = '';
        document.getElementById('agent-tag').value = '';
        document.getElementById('agent-instruction-tab').value = '';
        document.getElementById('agent-context-tab').value = '';
        document.getElementById('agent-system-prompt').value = '';
        document.getElementById('agent-w2').checked = true;
        document.getElementById('agent-w3').checked = false;
        document.getElementById('agent-w6').checked = false;
        document.getElementById('agent-storage-user').checked = true;
    }
    overlay.style.display = 'flex';
}
function closeAgentEditor() {
    const overlay = document.getElementById('agent-editor-overlay');
    if (overlay)
        overlay.style.display = 'none';
}
function saveAgentFromEditor() {
    const statusEl = document.getElementById('agent-editor-status');
    if (statusEl)
        statusEl.textContent = 'Saving…';
    const id = document.getElementById('agent-editor-id').value.trim();
    const storedInEl = document.querySelector('input[name="agent-storage"]:checked');
    const def = {
        id: id || undefined,
        displayName: document.getElementById('agent-name').value,
        tag: document.getElementById('agent-tag').value,
        instructionTabName: document.getElementById('agent-instruction-tab').value,
        contextTabName: document.getElementById('agent-context-tab').value || undefined,
        systemPrompt: document.getElementById('agent-system-prompt').value,
        workflows: {
            w2: document.getElementById('agent-w2').checked,
            w3: document.getElementById('agent-w3').checked,
            w6: document.getElementById('agent-w6').checked,
        },
        storedIn: (storedInEl && storedInEl.value === 'document') ? 'document'
            : (storedInEl && storedInEl.value === 'script') ? 'script'
                : 'user',
    };
    runServer('saveCustomAgent', def).then(function (result) {
        if (!result.ok) {
            if (statusEl)
                statusEl.textContent = result.error || 'Save failed.';
            return;
        }
        closeAgentEditor();
        refreshAgentsList();
    }).catch(function (err) {
        if (statusEl)
            statusEl.textContent = 'Error: ' + err;
    });
}

// ── Manifest generation ────────────────────────────────────────────────────────
function generateManifest(tabName) {
    const statusEl = document.getElementById('agents-status');
    if (statusEl)
        statusEl.textContent = 'Building manifest…';
    if (!tabName) {
        const sel = document.getElementById('tts-tab-select');
        tabName = sel?.value || undefined;
    }
    const resolveTab = tabName
        ? Promise.resolve(tabName)
        : runServer('getActiveTabName');
    resolveTab.then(function (tab) {
        if (!tab) {
            if (statusEl)
                statusEl.textContent = 'No active tab.';
            return;
        }
        return runServer('exportPartialManifest', tab).then(function (manifest) {
            if (!manifest) {
                if (statusEl)
                    statusEl.textContent = 'No TTS directives found on "' + tab + '".';
                return;
            }
            currentManifestJson_ = JSON.stringify(manifest, null, 2);
            var inner = manifest.chapter || manifest.openingCredits
                || manifest.closingCredits || manifest.aboutAuthor;
            showManifestOverlay_(tab, inner);
            if (statusEl)
                statusEl.textContent = '';
        });
    }).catch(function (err) {
        if (statusEl)
            statusEl.textContent = 'Error: ' + err;
    });
}
function showManifestOverlay_(tabName, manifest) {
    const overlay = document.getElementById('manifest-overlay');
    const tabLabel = document.getElementById('manifest-tab-label');
    const countEl = document.getElementById('manifest-section-count');
    const textarea = document.getElementById('manifest-textarea');
    const statusEl = document.getElementById('manifest-status');
    if (!overlay)
        return;
    if (tabLabel)
        tabLabel.textContent = tabName;
    if (countEl) {
        const speechCount = manifest.sections.filter(function (s) { return s.type === 'speech'; }).length;
        const silenceCount = manifest.sections.filter(function (s) { return s.type === 'silence'; }).length;
        countEl.textContent = '(' + manifest.sections.length + ' sections: ' + speechCount + ' speech, ' + silenceCount + ' silence)';
    }
    if (textarea)
        textarea.value = currentManifestJson_;
    if (statusEl)
        statusEl.textContent = '';
    overlay.style.display = 'flex';
}
function closeManifestOverlay() {
    const overlay = document.getElementById('manifest-overlay');
    if (overlay)
        overlay.style.display = 'none';
}
function copyManifest() {
    const textarea = document.getElementById('manifest-textarea');
    const statusEl = document.getElementById('manifest-status');
    if (!textarea || !currentManifestJson_)
        return;
    textarea.select();
    try {
        document.execCommand('copy');
        if (statusEl) {
            statusEl.textContent = 'Copied to clipboard.';
            setTimeout(function () { if (statusEl)
                statusEl.textContent = ''; }, 2000);
        }
    }
    catch (_) {
        if (statusEl)
            statusEl.textContent = 'Copy failed — select the text manually.';
    }
}
// ── W6 — Run with Context overlay ─────────────────────────────────────────────
var _w6AgentId_ = '';
/** Populates a tab <select> with all manageable tab names. Preserves the current selection. */
function loadW6TabSelect_(selId) {
    const sel = document.getElementById(selId);

    runServer('getManageableTabNames').then(function (tabs) {
        sel.innerHTML = (tabs && tabs.length)
            ? tabs.map(function (n) { return '<option value="' + escapeHtml_(n) + '">' + escapeHtml_(n) + '</option>'; }).join('')
            : '<option value="">— No tabs found —</option>';
        if (prev)
            sel.value = prev;
    }).catch(function () {
        sel.innerHTML = '<option value="">— Error —</option>';
    });
}

function confirmAgentImport() {
    const textarea = document.getElementById('agent-import-textarea');
    const statusEl = document.getElementById('agent-import-status');
    const btn = document.getElementById('agent-import-btn');
    const panelStatus = document.getElementById('agents-status');
    if (!textarea || !statusEl)
        return;
    const json = textarea.value.trim();
    if (!json) {
        statusEl.textContent = 'Paste the export JSON first.';
        return;
    }
    if (btn)
        btn.disabled = true;
    statusEl.textContent = 'Importing…';
    // Non-blocking: close the overlay immediately so the user isn't blocked.
    // The Tracer job created server-side carries the full result — it will
    // appear in the Logs panel and "Copy all logs" output.
    closeAgentImportOverlay();
    if (panelStatus)
        panelStatus.textContent = 'Importing agents…';
    runServer('importCustomAgents', json).then(function (result) {
        var lines = [];
        if (!result.ok) {
            lines.push('Import failed: ' + (result.errors || []).join('; '));
        }
        else {
            if (result.imported > 0)
                lines.push('Imported ' + result.imported + ' agent(s).');
            if (result.skipped && result.skipped.length) {
                lines.push('Skipped (' + result.skipped.length + ' tag collision' + (result.skipped.length > 1 ? 's' : '') + '): ' +
                    result.skipped.join(', ') + '. Change the @tag in the JSON to import under a different tag.');
            }
            if (result.errors && result.errors.length)
                lines.push('Errors: ' + result.errors.join('; '));
            if (result.imported === 0 && (!result.skipped || !result.skipped.length) && (!result.errors || !result.errors.length)) {
                lines.push('No agents found in the import payload.');
            }
        }
        var msg = lines.join(' ');
        if (panelStatus) {
            panelStatus.textContent = msg;
            // Auto-clear the panel status after 12 s so it doesn't linger.
            setTimeout(function () { if (panelStatus)
                panelStatus.textContent = ''; }, 12000);
        }
        if (result.ok && result.imported > 0)
            refreshAgentsList();
    }).catch(function (err) {
        if (panelStatus)
            panelStatus.textContent = 'Import error: ' + err;
    }).finally(function () {
        if (btn)
            btn.disabled = false;
    });
}

            if (result.status === 'complete') {
                setTeamAnalysisStatus_('Analysis complete — ' + result.processedCount + ' paragraph(s). Output in "' + result.outputTabName + '".', 'info');
                keepGoing = false;
            }
            else if (result.status === 'continuing') {
                setTeamAnalysisStatus_('Processed ' + result.processedCount + '/' + result.totalCount + ' paragraphs — continuing…', 'loading');
                // Brief pause to let the event loop breathe and avoid hammering the server.
                await new Promise(function (resolve) { setTimeout(resolve, 1500); });
            }
            else {
                setTeamAnalysisStatus_('Error: ' + (result.error || 'Unknown error'), 'error');
                keepGoing = false;
            }
        }
    }
    catch (e) {
        console.error('[startTeamAnalysis]', e);
        setTeamAnalysisStatus_('Error: ' + e.message, 'error');
    }
    finally {
        _teamsAnalysisRunning = false;
        if (btn)
            btn.disabled = false;
    }
}

</script>
